<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080c19"><title>NAVJ AI SÉCURITÉ - PREMIUM</title>
<style>
:root{--bg:#080c19;--card:#121c33;--line:#1f2d4d;--cyan:#2ec4ff;--gold:#f7c948;--text:#eef3ff;--muted:#8da0c0;--ok:#36e07d;--red:#ff4d5a}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:var(--bg);color:var(--text);line-height:1.5}
.top{position:sticky;top:0;z-index:20;background:rgba(8,12,25,.96);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{width:46px;height:46px;border-radius:12px;background:#0e1a33;border:1px solid var(--line);display:grid;place-items:center}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 90px}
.card{background:#121c33;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.badge{padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:10px;font-weight:900;letter-spacing:.5px}
.ref{background:#0a1226;color:var(--gold)}.premium{background:linear-gradient(90deg,#f7c948,#ffe89a);color:#2a1f00;border:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.label{font-size:10px;letter-spacing:1px;font-weight:800;color:var(--muted);text-transform:uppercase;margin:10px 0 6px;display:block}
.input,.textarea,.select{width:100%;background:#0b1328;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:12px;font-size:14px;outline:none}
.textarea{min-height:110px}
.btn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;cursor:pointer;display:flex;justify-content:center;gap:6px;align-items:center}
.btn-cyan{background:linear-gradient(90deg,#2ec4ff,#7adfff);color:#00101a}
.btn-gold{background:linear-gradient(90deg,#f7c948,#ffe89a);color:#2a1f00}
.btn-line{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn-red{background:linear-gradient(90deg,#ff4d5a,#ff8a90);color:white}
.btn-green{background:#25D366;color:white}
.clockBox{background:#0a1226;border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.list{background:#0b1328;border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:8px;white-space:pre-wrap}
.lock{border:2px dashed #f7c948;background:rgba(247,201,72,.08);border-radius:18px;padding:14px;text-align:center;margin-top:12px}
.mic{width:86px;height:86px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 30%,#ff6b6b,#9e0000);color:white;margin:12px auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mic.on{background:radial-gradient(circle at 30% 30%,#63ffa1,#0a7a2d)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#0a1122ee;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px}
.nav button{background:transparent;border:0;color:var(--muted);font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;padding:6px 10px}
.nav button.active{color:var(--cyan);background:rgba(46,196,255,.12);border-radius:10px}
.premium-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
</style></head><body>
<div class="top"><div style="display:flex;gap:10px;align-items:center"><div class="logo"><svg width="28" height="28" viewBox="0 0 100 100"><path d="M50 10 L80 21 L80 56 C80 73 66 88 50 94 C34 88 20 73 20 56 L20 21 Z" fill="#0e1d3a" stroke="#2ec4ff" stroke-width="2"/><path d="M32 38 V62 H38 V48 L52 62 H58 V38 H52 V52 L38 38 Z" fill="white"/></svg></div><div><div style="font-weight:900">NAVJ AI <span style="color:#2ec4ff">SÉCURITÉ</span></div><div style="font-size:9px;color:#8da0c0;letter-spacing:1px">SECURITY GUARD</div></div></div><div id="planBadge"><span class="badge ref">GRATUIT</span></div></div>
<div class="wrap">
<div id="p-dash">
<div class="card" style="background:linear-gradient(180deg,#121c33,#0e152a)"><h2>🛡️ Centre de contrôle</h2><div class="grid2" style="margin-top:12px"><div class="clockBox"><div style="font-size:9px;color:#8da0c0">ABIDJAN</div><div id="clkAbj" style="font-weight:800">--:--:--</div><div style="font-size:9px;color:var(--ok)" id="gpsStatus">📍 GPS prêt</div></div><div class="clockBox"><div style="font-size:9px;color:#8da0c0">SERVICE</div><div id="serviceStat" style="font-weight:800;color:var(--muted)">HORS SERVICE</div><div id="pointageHeure" style="font-size:10px;color:#8da0c0"></div></div></div></div>
<div class="grid2" style="margin-top:12px">
<button class="btn btn-cyan" onclick="go('rapport')">📝 Rapport</button>
<button class="btn btn-line" onclick="go('pointage')">📍 Pointage</button>
<button class="btn btn-line" onclick="go('vip')">👑 Passation VIP</button>
<button class="btn btn-line" onclick="go('ronde')">🛡️ Ronde</button>
</div>
<div class="card" id="premiumBanner">
<h3>👑 Mode PREMIUM - 1000F / mois</h3>
<p style="font-size:12px;color:#8da0c0;margin-top:6px">Pointage GPS + photo, Passation VIP directe WhatsApp responsable, Ronde QR, Rapport SOS</p>
<div class="grid2" style="margin-top:10px"><button class="btn btn-gold" onclick="payerPremium()">💳 Payer 1000F Wave</button><button class="btn btn-line" onclick="activerCode()">🔑 J'ai un code</button></div>
</div>
<div class="card"><h3>📋 Rapport d'incident</h3><label class="label">Faits observés</label><textarea id="rapport" class="textarea" placeholder="Décris..."></textarea>
<div class="card" style="background:#0a1226;border-style:dashed"><h3>🎙️ Vocal</h3><button class="mic" id="micBtn" onclick="parler()">🎤</button><div class="grid2"><button class="btn btn-line" onclick="ecouter()">🔊 Réécouter</button><button class="btn btn-line" onclick="corriger()">✍️ Corriger</button></div></div>
<button class="btn btn-cyan" style="margin-top:10px" onclick="preparerRapport()">Préparer rapport</button><div id="resultat" class="list">Résultat ici...</div>
<div class="grid2" style="margin-top:10px"><button class="btn btn-gold" onclick="exporterPDF()">📄 PDF</button><button class="btn btn-green" onclick="envoyerWhatsApp()">💬 WhatsApp</button></div>
<button class="btn btn-red" style="margin-top:10px" onclick="alerteSOS()">🚨 SOS ALERTE RESPONSABLE</button>
</div>
<div class="card"><h3>👤 Profil</h3><input id="f_agent" class="input" placeholder="Nom agent" style="margin-top:8px"><input id="f_soc" class="input" placeholder="Société sécurité" style="margin-top:8px"><input id="f_site" class="input" placeholder="Site / Client" style="margin-top:8px"><input id="f_wa" class="input" placeholder="WhatsApp responsable +225..." style="margin-top:8px"><input id="f_wa_dir" class="input" placeholder="WhatsApp Direction +225... (PREMIUM)" style="margin-top:8px;border-color:var(--gold)"><button class="btn btn-line" style="margin-top:8px" onclick="saveP()">💾 Enregistrer</button></div>
</div>
